  document.addEventListener('DOMContentLoaded', () => {
    const select = document.getElementById('tipLamxtabla');
    const tbody  = document.getElementById('itemTable');
    const mtsPorUnidad = { '4x8': 2.9768, '4x10': 3.721 };
    const LIMITE = 10;

    function renderTabla(tipo) {

      if (!metraje) return;           // valor inesperado → salimos

      let filas = '';
      for (let i = 1; i <= LIMITE; i++) {
        filas += `
          <tr>
            <td>${i}</td>
            <td>→</td>
            <td>${(i * metraje).toFixed(2)}</td>
          </tr>`;
      }
      tbody.innerHTML = filas;
    }

    /* pinta la tabla al iniciar */
    renderTabla(select.value);

    /* repinta al cambiar */
    select.addEventListener('change', () => renderTabla(select.value));
  });
